name: Publish DomruDesktop 0.1.30 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-0.1.30
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify requested version
        shell: pwsh
        run: |
          [xml]$project = Get-Content Domru.Desktop/Domru.Desktop.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -ne '0.1.30') { throw 'This workflow publishes only 0.1.30' }
      - name: Install independent test generator
        shell: pwsh
        run: python -m pip install -r Domru.Tests/requirements.txt
      - name: Test and build clean distribution
        shell: pwsh
        run: ./build.ps1
      - name: Package source and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git archive --format=zip --output=release/DomruDesktop-source-0.1.30.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Get-ChildItem release -Filter '*.zip' | ForEach-Object { "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: domru-0.1.30
          path: |
            release/*.zip
            release/SHA256SUMS.txt
            RELEASE_NOTES.md
          retention-days: 7
  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: domru-0.1.30
      - name: Create requested release without overwriting any existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v0.1.30 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Version 0.1.30 already exists; no changes made.'; exit 0 }
          gh release create v0.1.30 release/DomruDesktop-win-x64-0.1.30.zip release/DomruDesktop-source-0.1.30.zip release/SHA256SUMS.txt --target $env:GITHUB_SHA --title 'DomruDesktop 0.1.30' --notes-file RELEASE_NOTES.md --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
